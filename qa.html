<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoloPage Q&A</title>
    <link rel="stylesheet" href="qa-styles.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <h1>PoloPage Q&A</h1>
            <div class="user-controls">
                <button id="loginBtn">Login</button>
                <button id="signupBtn">Sign Up</button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="sidebar">
            <button id="askQuestionBtn" class="primary-button">Ask a Question</button>
            <div class="filter-section">
                <h3>Sort By</h3>
                <select id="sortSelect">
                    <option value="newest">Newest</option>
                    <option value="popular">Most Popular</option>
                    <option value="unanswered">Unanswered</option>
                </select>
            </div>
        </div>

        <div class="content">
            <div id="questionForm" class="question-form hidden">
                <h2>Ask a Question</h2>
                <form id="newQuestionForm">
                    <input type="text" id="questionTitle" placeholder="Title" required>
                    <textarea id="questionContent" placeholder="What's your question? Be specific." required></textarea>
                    <div class="form-controls">
                        <button type="submit" class="primary-button">Post Question</button>
                        <button type="button" class="secondary-button" id="cancelQuestion">Cancel</button>
                    </div>
                </form>
            </div>

            <div id="questionsList" class="questions-list">
                <!-- Questions will be dynamically inserted here -->
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
